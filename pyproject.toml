[project]
name = "toronto-bikeshare-forecast"
version = "0.1.0"
description = "Point-in-time-correct availability forecasting for Toronto Bike Share stations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Toronto Bike Share Forecast contributors" }]
dependencies = [
  "duckdb>=1.3,<2",
  "httpx>=0.28,<1",
  "polars>=1.32,<2",
  "pydantic>=2.11,<3",
  "pytz>=2025.2",
  "typer>=0.16,<1",
]

[project.scripts]
bikeshare = "bikeshare_forecast.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bikeshare_forecast"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bikeshare_forecast"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["bikeshare_forecast"]
branch = true
