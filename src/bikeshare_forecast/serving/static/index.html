<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toronto Bike Share Forecast</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header>
      <p class="eyebrow">TORONTO BIKE SHARE</p>
      <h1>Where will bike demand move next?</h1>
      <p class="lede">Live station status with short-horizon departure and arrival forecasts.</p>
    </header>
    <main>
      <section class="controls" aria-label="Forecast controls">
        <label for="search">Find a station</label>
        <input id="search" type="search" placeholder="Name or station ID" autocomplete="off" />
        <div id="stations" class="station-list" role="listbox" aria-label="Stations"></div>
      </section>
      <section id="detail" class="detail" aria-live="polite">
        <p class="empty-state">Choose a station to see its outlook.</p>
      </section>
    </main>
    <footer>
      <p>Demand forecasts do not guarantee future inventory. Not affiliated with Bike Share Toronto.</p>
    </footer>
    <script src="/static/app.js" defer></script>
  </body>
</html>
